name: Build & Release

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [main]

permissions:
  contents: write           # 允许创建 release

jobs:
  # ── 各平台编译 ──────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish ${{ matrix.rid }}
        shell: bash
        run: |
          dotnet publish SKIPPY.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugType=embedded \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish-out

      - name: Bundle skins + tesseract
        shell: bash
        run: |
          mkdir -p publish-out/皮肤
          cp -r 皮肤/*.png publish-out/皮肤/ 2>/dev/null || echo "no skins found"
          if [ -d publish/tesseract ]; then
            cp -r publish/tesseract publish-out/
            echo "tesseract bundled"
          fi

      - name: Zip output
        shell: bash
        run: |
          cd publish-out
          zip -r ../SKIPPY-${{ matrix.rid }}.zip . >/dev/null
          cd ..
          ls -lh SKIPPY-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKIPPY-${{ matrix.rid }}
          path: SKIPPY-${{ matrix.rid }}.zip
          if-no-files-found: error

  # ── 汇总发布 ────────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute version + changelog
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # 查现有 releases，取最高 v0.1.X → +1
          prev_num=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -oP 'v0\.1\.\d+' | grep -oP '\d+$' | sort -n | tail -1 || true)
          if [ -z "$prev_num" ]; then
            new_num=0
            prev_tag=""
          else
            new_num=$((prev_num + 1))
            prev_tag=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
              | grep -oP 'v0\.1\.\d+' | sort -V | tail -1)
          fi

          TAG="v0.1.${new_num}"
          NAME="Beta β - v0.1.${new_num}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=${new_num}" >> "$GITHUB_OUTPUT"

          # 自上次 release 以来的 commits
          if [ -n "$prev_tag" ]; then
            last_sha=$(gh release view "$prev_tag" --json targetCommitish --jq .targetCommitish 2>/dev/null || echo "")
            if [ -n "$last_sha" ] && [ "$last_sha" != "$(git rev-parse HEAD)" ]; then
              git log "$last_sha..HEAD" --pretty=format:'- %h %s (%an)' > commits.txt || true
            fi
          fi
          if [ ! -s commits.txt ]; then
            echo "首次发布" > commits.txt
          fi
          echo "commits file: $(wc -l < commits.txt) lines"

      - name: Write release notes
        run: |
          cat > notes.md << EOF
          ## ${{ steps.version.outputs.name }}

          ### 本次变更（自上次 release 以来的 commits）

          $(cat commits.txt)

          ### 平台包

          - SKIPPY-win-x64.zip — Windows x64
          - SKIPPY-win-arm64.zip — Windows ARM64
          - SKIPPY-linux-x64.zip — Linux x64
          - SKIPPY-linux-arm64.zip — Linux ARM64
          - SKIPPY-osx-x64.zip — macOS Intel
          - SKIPPY-osx-arm64.zip — macOS Apple Silicon

          > 程序为自包含单文件，解压后直接运行。若启用屏幕监控功能，需自行安装 tesseract + chi_sim。
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          ls -lh
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.name }}" \
            --notes-file ../notes.md \
            --prerelease \
            --target "${{ github.sha }}" \
            SKIPPY-*.zip
          echo "✅ released: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.tag }})"
